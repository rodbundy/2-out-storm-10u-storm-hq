<!doctype html><html><head><base target="_top"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><?!= include('StormStyles'); ?></head><body>
<div id="login" class="login"><div class="login-card"><span class="kicker">My Storm Player</span><h1>Family<br>Portal</h1><p>Enter the private six-digit player code from Coach. The same code controls availability, homework, family messages, and photo submissions.</p><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit player code"><button class="btn primary" onclick="login()">Enter the Storm</button><div id="msg" class="notice hidden"></div></div></div>
<div id="shell" class="hidden"><header class="top"><div class="brand"><div class="brand-mark">🌪</div><div><b id="player-name">MY STORM PLAYER</b><small>Family Portal · <?= version ?></small></div></div><div class="top-actions"><a id="website" class="btn small" target="_blank">Team Website</a><button class="btn small" onclick="logout()">Sign Out</button></div></header><div class="app"><aside class="side"><button class="active" data-tab="overview">⚡ Overview</button><button data-tab="availability">📅 Availability</button><button data-tab="homework">📚 Homework</button><button data-tab="messages">📣 Coach Messages</button><button data-tab="photos">📷 Submit a Photo</button></aside><main class="main"><div id="view"></div></main></div></div>
<script>
let TOKEN='',DATA=null,TAB='overview';const APP_URL='<?= appUrl ?>';const qs=s=>document.querySelector(s),qsa=s=>[...document.querySelectorAll(s)];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function run(fn,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));r[fn](...args);});}
function message(t,c=''){const e=qs('#msg');e.textContent=t;e.className='notice '+c;e.classList.remove('hidden')}
async function login(){try{message('Checking player code…');const r=await run('familyLogin',qs('#code').value);TOKEN=r.token;sessionStorage.setItem('stormFamilyToken',TOKEN);qs('#login').classList.add('hidden');qs('#shell').classList.remove('hidden');await refresh();}catch(e){message(e.message,'error')}}
function logout(){sessionStorage.removeItem('stormFamilyToken');location.reload()}
async function refresh(){try{DATA=await run('getFamilyDashboard',TOKEN);qs('#player-name').textContent='#'+(DATA.player.Jersey||'')+' '+DATA.player.FirstName;const domain=(DATA.settings.websiteDomain||'2outstorm2035.com').replace(/^https?:\/\//,'');qs('#website').href='https://'+domain;render();}catch(e){alert(e.message);if(/expired/i.test(e.message))logout();}}
qsa('.side button').forEach(b=>b.onclick=()=>{qsa('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');TAB=b.dataset.tab;render()});
function head(k,h,p){return `<div class="page-head"><div><span class="kicker">${k}</span><h1>${h}</h1><p>${p}</p></div></div>`}
function pill(v){const s=String(v||'').toUpperCase(),c=/READY|SUBMITTED|YES/.test(s)?'good':/NOT AVAILABLE/.test(s)?'bad':'warn';return `<span class="status ${c}">${esc(v||'Not Set')}</span>`}
function render(){({overview,availability,homework,messages,photos}[TAB]||overview)()}
function overview(){const p=DATA.player,up=DATA.events?.[0],active=DATA.weeks?.find(w=>String(w.Status).toUpperCase()==='ACTIVE');qs('#view').innerHTML=head('My Storm Player',`#${esc(p.Jersey)} ${esc(p.FirstName)}`,'Everything your family needs without searching through texts and links.')+`<div class="grid three"><div class="card stat"><span>Next Impact</span><strong style="font-size:22px">${esc(up?up.Date:'TBD')}</strong><small>${esc(up?up.Title||up.Type:'No event published')}</small></div><div class="card stat"><span>Homework</span><strong style="font-size:22px">${esc(active?active.Title:'No Active Week')}</strong><small>${active?'Due '+esc(active.DueDate||''):'Check back soon'}</small></div><div class="card stat"><span>Coach Messages</span><strong>${DATA.messages?.length||0}</strong><small>Family-only updates</small></div></div><div class="grid two" style="margin-top:14px"><div class="card"><span class="kicker">Quick Actions</span><h3>Ready for the Storm?</h3><div class="button-row"><button class="btn primary" onclick="TAB='availability';render()">Availability</button><button class="btn orange" onclick="TAB='homework';render()">Homework</button><button class="btn" onclick="TAB='photos';render()">Submit Photo</button></div></div><div class="card"><span class="kicker">Player Development</span><h3>${esc(p.SeasonGoal||'Keep building.')}</h3><p style="color:var(--muted)">${esc(p.StrongestPart||'Effort, energy, and coachability.')}</p></div></div>`}
function availability(){const existing={};(DATA.availability||[]).forEach(r=>existing[String(r.EventID)]=r);qs('#view').innerHTML=head('Availability','Ready for the Storm?','Mark each upcoming event so coaches can plan groups and game-day lineups.')+`<div class="grid">${(DATA.events||[]).map(e=>{const r=existing[String(e.EventID)]||{};return `<article class="card"><div class="page-head"><div><span class="kicker">${esc(e.Date)} · ${esc(e.Time||'TBD')}</span><h3>${esc(e.Title||e.Type)} ${e.Opponent?'vs. '+esc(e.Opponent):''}</h3><p>${esc(e.Location||'')} ${e.Field?'· '+esc(e.Field):''}</p></div>${pill(r.Status)}</div><div class="form-grid"><div class="field"><label>Status</label><select id="status-${esc(e.EventID)}"><option ${r.Status==='READY FOR THE STORM'?'selected':''}>READY FOR THE STORM</option><option ${r.Status==='NOT AVAILABLE'?'selected':''}>NOT AVAILABLE</option><option ${r.Status==='FORECAST UNCERTAIN'?'selected':''}>FORECAST UNCERTAIN</option></select></div><div class="field"><label>Note for Coach</label><input id="note-${esc(e.EventID)}" value="${esc(r.Notes||'')}"></div></div><button class="btn primary" style="margin-top:10px" onclick="saveAvail('${esc(e.EventID)}')">Save Availability</button></article>`}).join('')||'<div class="card">No upcoming events.</div>'}</div>`}
async function saveAvail(id){try{await run('saveAvailability',TOKEN,id,qs('#status-'+CSS.escape(id)).value,qs('#note-'+CSS.escape(id)).value);await refresh();alert('Availability saved.');}catch(e){alert(e.message)}}
function responseFor(week){return (DATA.responses||[]).find(r=>String(r.WeekID)===String(week.WeekID));}
function homework(){const weeks=DATA.weeks||[];qs('#view').innerHTML=head('Storm Homework','Work When Nobody Watches','Complete coach-assigned drills and softball-IQ questions. A parent submits the work using this private player code.')+`<div class="grid">${weeks.map(w=>homeworkWeek(w)).join('')||'<div class="card">No homework is active right now.</div>'}</div>`}
function homeworkWeek(w){const tasks=(DATA.tasks||[]).filter(t=>String(t.WeekID)===String(w.WeekID)),questions=(DATA.questions||[]).filter(q=>String(q.WeekID)===String(w.WeekID)),prev=responseFor(w);let oldTasks={},oldAns={};try{oldTasks=JSON.parse(prev?.TaskCompletionJSON||'{}')}catch(e){}try{oldAns=JSON.parse(prev?.AnswersJSON||'{}')}catch(e){}return `<section class="card" data-week="${esc(w.WeekID)}"><span class="kicker">${esc(w.Title)}</span><h3>${esc(w.Theme||'The work continues.')}</h3><p style="color:var(--muted)">${esc(w.CoachMessage||'')}</p><div class="button-row"><span class="status warn">Due ${esc(w.DueDate||'')}</span>${prev?pill('Submitted'):pill('Not Submitted')}</div><h3>Drills & Practice</h3><div class="list-stack">${tasks.map(t=>{const old=oldTasks[t.TaskID]||{};return `<label class="check-card"><input type="checkbox" data-task="${esc(t.TaskID)}" ${old.done?'checked':''}><span style="flex:1"><b>${esc(t.Title)}</b><small style="display:block;color:var(--muted)">${esc(t.Description||'')} ${t.Target?`· Target ${esc(t.Target)} ${esc(t.Unit||'')}`:''}</small>${t.VideoURL?`<a target="_blank" style="color:#ffc08a" href="${esc(t.VideoURL)}">Watch drill video</a>`:''}</span><input data-task-value="${esc(t.TaskID)}" style="width:90px" placeholder="Reps/min" value="${esc(old.value||'')}"></label>`}).join('')||'<p>No drill items.</p>'}</div><h3>Softball IQ</h3><div class="list-stack">${questions.map((q,i)=>questionHtml(q,oldAns[q.QuestionID],i+1)).join('')||'<p>No questions this week.</p>'}</div><button class="btn primary" style="margin-top:14px" onclick="submitWeek('${esc(w.WeekID)}')">Submit This Week</button>${prev?`<p><small>Last submitted: ${esc(prev.SubmittedAt||'')} · Auto-graded score ${esc(prev.Score||0)}/${esc(prev.MaxScore||0)}</small></p>`:''}</section>`}
function questionHtml(q,old,n){const type=String(q.Type||'').toLowerCase();if(type.includes('multiple')){const opts=String(q.Options||'').split('|').filter(Boolean);return `<div class="field"><label>${n}. ${esc(q.Question)}</label><select data-question="${esc(q.QuestionID)}"><option value="">Choose…</option>${opts.map(o=>`<option ${String(old||'')===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}if(type.includes('true'))return `<div class="field"><label>${n}. ${esc(q.Question)}</label><select data-question="${esc(q.QuestionID)}"><option></option><option ${String(old)==='True'?'selected':''}>True</option><option ${String(old)==='False'?'selected':''}>False</option></select></div>`;return `<div class="field"><label>${n}. ${esc(q.Question)}</label><textarea data-question="${esc(q.QuestionID)}">${esc(old||'')}</textarea></div>`}
async function submitWeek(id){const sec=qs(`[data-week="${CSS.escape(id)}"]`),tasks={},answers={};qsa('[data-task]',sec).forEach(c=>{const tid=c.dataset.task;tasks[tid]={done:c.checked,value:qs(`[data-task-value="${CSS.escape(tid)}"]`,sec)?.value||''}});qsa('[data-question]',sec).forEach(x=>answers[x.dataset.question]=x.value);try{const r=await run('submitHomework',TOKEN,id,tasks,answers);await refresh();alert(`Homework submitted. Auto-graded score: ${r.score}/${r.maxScore}.`);}catch(e){alert(e.message)}}
function messages(){qs('#view').innerHTML=head("Coach's Forecast",'Team Messages','Family-only reminders, travel information, equipment notes, and coach communication.')+`<div class="grid two">${(DATA.messages||[]).map(m=>`<article class="card"><span class="kicker">${esc(m.AlertLevel||"Coach's Forecast")}</span><h3>${esc(m.Title)}</h3><p style="color:var(--muted)">${esc(m.Message||'')}</p></article>`).join('')||'<div class="card">No family-only messages right now.</div>'}</div>`}
function photos(){qs('#view').innerHTML=head('Family Photos','Submit a Photo','Send a parent-approved photo to the coach approval queue. Nothing goes public automatically.')+`<div class="card"><div class="form-grid"><div class="field"><label>Parent Name</label><input id="parent-name"></div><div class="field"><label>Photo Title</label><input id="photo-title" placeholder="Tournament Weekend"></div><div class="field full"><label>Caption / Note</label><textarea id="photo-caption"></textarea></div><div class="field full"><label>Choose Photo</label><input id="photo-file" type="file" accept="image/*"></div></div><button class="btn primary" style="margin-top:12px" onclick="sendPhoto()">Submit to Coach</button><p style="color:var(--muted)"><small>Please submit only photos you have permission to share with the team.</small></p></div>`}
async function sendPhoto(){const f=qs('#photo-file').files[0];if(!f){alert('Choose a photo first.');return}if(f.size>8*1024*1024){alert('Please use a photo under 8 MB.');return}const data=await fileData(f);try{await run('submitFamilyPhoto',TOKEN,qs('#photo-title').value,qs('#photo-caption').value,data,f.name,f.type,qs('#parent-name').value);alert('Photo sent to the coach approval queue.');qs('#photo-file').value='';}catch(e){alert(e.message)}}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
(async function restore(){const t=sessionStorage.getItem('stormFamilyToken');if(t){TOKEN=t;try{qs('#login').classList.add('hidden');qs('#shell').classList.remove('hidden');await refresh();}catch(e){logout();}}})();
</script></body></html>
