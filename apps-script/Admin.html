<!doctype html><html><head><base target="_top"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><?!= include('StormStyles'); ?></head><body>
<div id="login" class="login"><div class="login-card"><span class="kicker">Storm HQ <?= version ?></span><h1>Coach Control<br>Center</h1><p>Run the website, team information, homework, tryouts, event groups, and game-day tools without editing GitHub.</p><input id="password" type="password" placeholder="Coach password" autocomplete="current-password"><button class="btn primary" onclick="login()">Enter the Storm</button><div id="login-msg" class="notice hidden"></div></div></div>
<div id="shell" class="hidden"><header class="top"><div class="brand"><div class="brand-mark">🌪</div><div><b>STORM HQ</b><small>Coach Control Center · <?= version ?></small></div></div><div class="top-actions"><a id="public-site" class="btn small" target="_blank">View Website</a><button class="btn small" onclick="refreshAll()">Refresh</button><button class="btn small" onclick="logout()">Sign Out</button></div></header><div class="app"><aside class="side">
<div class="group">Command</div><button class="active" data-tab="dashboard">⚡ Dashboard</button><button data-tab="schedule">📅 Schedule & Games</button><button data-tab="messages">📣 Team Messages</button><button data-tab="players">🥎 Players & Photos</button><button data-tab="tryouts">🌪 Tryout Center</button><button data-tab="homework">📚 Storm Homework</button><div class="group">Game Day</div><button data-tab="rosters">👥 Event Groups</button><button data-tab="gameday">🧢 Game Day Builder</button><div class="group">Content</div><button data-tab="media">🎥 Media & Reports</button><button data-tab="pending">✅ Pending Approvals</button><button data-tab="reports">📊 Team Reports</button><div class="group">System</div><button data-tab="settings">⚙ Branding, Forms & Links</button><button data-tab="help">❓ How To</button>
</aside><main class="main"><div id="view"></div></main></div></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><span id="modal-kicker" class="kicker">Edit</span><h2 id="modal-title">Storm HQ</h2></div><button class="btn small" onclick="closeModal()">Close ✕</button></div><div id="modal-body"></div></div></div>
<script>
let TOKEN='',BOOT=null,TAB='dashboard',SELECTED_WEEK='',PLAYER_UPLOAD='';
const APP_URL='<?= appUrl ?>';
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function run(fn,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e))); r[fn](...args);});}
function notice(msg,type=''){const el=qs('#login-msg');el.textContent=msg;el.className='notice '+type;el.classList.remove('hidden');}
async function login(){try{notice('Checking access…');const r=await run('adminLogin',qs('#password').value);TOKEN=r.token;sessionStorage.setItem('stormAdminToken',TOKEN);qs('#login').classList.add('hidden');qs('#shell').classList.remove('hidden');await refreshAll();}catch(e){notice(e.message,'error')}}
function logout(){TOKEN='';sessionStorage.removeItem('stormAdminToken');location.reload()}
async function refreshAll(){try{BOOT=await run('getAdminBootstrap',TOKEN);const d=(BOOT.settings.websiteDomain||'2outstorm2035.com').replace(/^https?:\/\//,'');qs('#public-site').href='https://'+d;render();}catch(e){alert(e.message);if(/expired/i.test(e.message))logout();}}
qsa('.side button[data-tab]').forEach(b=>b.addEventListener('click',()=>{qsa('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');TAB=b.dataset.tab;render();}));
function table(name){return BOOT?.tables?.[name]||[]}
function openModal(title,body,kicker='Edit'){qs('#modal-title').textContent=title;qs('#modal-kicker').textContent=kicker;qs('#modal-body').innerHTML=body;qs('#modal').classList.remove('hidden')}
function closeModal(){qs('#modal').classList.add('hidden');PLAYER_UPLOAD=''}
function pageHead(k,h,p,actions=''){return `<div class="page-head"><div><span class="kicker">${k}</span><h1>${h}</h1><p>${p}</p></div><div class="button-row">${actions}</div></div>`}
function helpBox(t){return `<div class="helpbox"><b>How to:</b> ${t} <button class="btn small" style="float:right" onclick="TAB='help';render();">Full guide</button></div>`}
function pill(v){const s=String(v||'').toUpperCase();const c=/READY|YES|APPROVED|ACTIVE|OPEN/.test(s)?'good':/NOT|REJECT|CLOSED|CANCEL/.test(s)?'bad':'warn';return `<span class="status ${c}">${esc(v||'—')}</span>`}
function render(){if(!BOOT)return;({dashboard:renderDashboard,schedule:renderSchedule,messages:renderMessages,players:renderPlayers,tryouts:renderTryouts,homework:renderHomework,rosters:renderRosters,gameday:renderGameDay,media:renderMedia,pending:renderPending,reports:renderReports,settings:renderSettings,help:renderHelp}[TAB]||renderDashboard)()}
function renderDashboard(){const s=BOOT.stats||{};qs('#view').innerHTML=pageHead('Coach Command','Storm Dashboard','Everything important at a glance. The goal: update the team from here, not from code.',`<button class="btn primary" onclick="TAB='schedule';render()">+ Add Event</button><button class="btn orange" onclick="TAB='messages';render()">Post Message</button>`)+`<div class="grid four"><div class="card stat"><span>Public Players</span><strong>${s.players||0}</strong></div><div class="card stat"><span>Upcoming Events</span><strong>${s.upcoming||0}</strong></div><div class="card stat"><span>Pending Players</span><strong>${s.pending||0}</strong></div><div class="card stat"><span>Active Homework</span><strong>${s.activeHomework||0}</strong></div></div><div class="grid two" style="margin-top:14px"><div class="card"><span class="kicker">Quick Actions</span><h3>Run the Team</h3><div class="button-row"><button class="btn" onclick="TAB='players';render()">Players</button><button class="btn" onclick="TAB='rosters';render()">Event Groups</button><button class="btn" onclick="TAB='gameday';render()">Game Day</button><button class="btn" onclick="TAB='homework';render()">Homework</button><button class="btn" onclick="TAB='tryouts';render()">Tryouts</button></div></div><div class="card"><span class="kicker">System Principle</span><h3>Enter It Once.</h3><p style="color:var(--muted)">A game created in Schedule feeds Next Impact, Storm Tracker, event details, parent availability, Event Groups, and the Game Day Builder.</p></div></div>`}

const SCHEMAS={
'Website Calendar':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Date','date'],['Time','text'],['EndTime','text'],['Type','select',['Practice','Game','Tournament','Team Event','Tryout']],['Title','text'],['Opponent','text'],['Location','text'],['Field','text'],['Address','text'],['DirectionsURL','url'],['ArrivalTime','text'],['Uniform','text'],['Status','select',['Storm Forming','Storm Watch','Storm Warning','Next Impact','Storm Passed','Cancelled']],['RosterVisibility','select',['FAMILY','PUBLIC']],['PublicNotes','textarea'],['EventNotes','textarea'],['ScoreUs','number'],['ScoreThem','number'],['Result','text'],['SortOrder','number']],
'Website Announcements':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Visibility','select',['PUBLIC','FAMILY','BOTH']],['AlertLevel','select',["Today's Forecast",'Storm Warning','Severe Weather Alert','Travel Forecast','Equipment Advisory']],['Title','text'],['Message','textarea'],['StartDate','date'],['EndDate','date'],['ButtonText','text'],['ButtonURL','url'],['PinToHome','select',['YES','NO']],['SortOrder','number']],
'Website Tryouts':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Date','date'],['Time','text'],['EndTime','text'],['Status','select',['Scheduled','Open Practice','By Appointment','Limited Openings','Full','Cancelled','Completed']],['Title','text'],['Location','text'],['Field','text'],['AgeGroup','text'],['PositionsWanted','text'],['PitchersWanted','select',['YES','NO']],['CatchersWanted','select',['YES','NO']],['ArrivalTime','text'],['WhatToBring','textarea'],['Description','textarea'],['RegistrationURL','url'],['ContactText','text'],['Capacity','number'],['InternalNotes','textarea'],['SortOrder','number']],
'Website Videos':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Category','select',['Full-Force Games','Lightning Strikes','Caught in the Storm','In the Circle','Behind the Storm','Rising Storm','Built by the Storm','Control the Wind','Own the Ground','Protect the Eye','Storm Strength','Storm IQ']],['Title','text'],['Description','textarea'],['YouTubeID','text'],['VideoURL','url'],['ThumbnailURL','url'],['Date','date'],['EventID','text'],['PlayerID','text'],['Featured','select',['YES','NO']],['SortOrder','number']],
'Website Shoutouts':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Category','select',['Ground Shaker','Lightning Strike','Storm Surge','Practice Win','Player Spotlight',"Coach's Report"]],['Title','text'],['Player','text'],['Message','textarea'],['Date','date'],['SortOrder','number']],
'Website Gallery':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Title','text'],['Caption','textarea'],['ImageURL','url'],['Date','date'],['PlayerID','text'],['Category','text'],['SortOrder','number']],
'Website Picture of the Week':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Title','text'],['Week','text'],['Caption','textarea'],['ImageURL','url'],['SubmittedBy','text']],
'Homework Weeks':[['Show','select',['YES','NO']],['Approved','select',['YES','NO']],['Title','text'],['Theme','text'],['CoachMessage','textarea'],['StartDate','date'],['DueDate','date'],['Status','select',['DRAFT','SCHEDULED','ACTIVE','CLOSED']],['BonusText','textarea'],['SortOrder','number']],
'Homework Tasks':[['WeekID','text'],['Title','text'],['Description','textarea'],['Category','select',['Throwing','Hitting','Fielding','Catching','Pitching','Conditioning','Softball IQ','Other']],['Target','text'],['Unit','text'],['VideoURL','url'],['Required','select',['YES','NO']],['SortOrder','number']],
'Homework Questions':[['WeekID','text'],['Type','select',['Multiple Choice','True/False','Short Answer']],['Question','textarea'],['Options','text'],['CorrectAnswer','text'],['Points','number'],['Explanation','textarea'],['SortOrder','number']]
};
const KEYS={'Website Calendar':'EventID','Website Announcements':'AnnouncementID','Website Tryouts':'TryoutID','Website Videos':'VideoID','Website Shoutouts':'ShoutoutID','Website Gallery':'PhotoID','Website Picture of the Week':'PictureID','Homework Weeks':'WeekID','Homework Tasks':'TaskID','Homework Questions':'QuestionID'};
function fieldHtml(name,type,opts,val){const v=val??'';if(type==='select')return `<div class="field"><label>${esc(name)}</label><select name="${name}">${opts.map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field full"><label>${esc(name)}</label><textarea name="${name}">${esc(v)}</textarea></div>`;return `<div class="field"><label>${esc(name)}</label><input type="${type}" name="${name}" value="${esc(v)}"></div>`}
function openGeneric(sheet,keyValue,defaults={}){const key=KEYS[sheet],rec=table(sheet).find(r=>String(r[key])===String(keyValue))||defaults;const body=`<form id="generic-form"><div class="form-grid">${SCHEMAS[sheet].map(f=>fieldHtml(f[0],f[1],f[2]||[],rec[f[0]])).join('')}</div><div class="button-row" style="margin-top:16px"><button type="button" class="btn primary" onclick="saveGeneric('${sheet}','${esc(rec[key]||'')}')">Save</button>${rec[key]?`<button type="button" class="btn bad" onclick="deleteGeneric('${sheet}','${esc(rec[key])}')">Delete</button>`:''}</div></form>`;openModal(rec[key]?'Edit':'Add',body,sheet.replace('Website ','').replace('Homework ', 'Homework '));}
async function saveGeneric(sheet,keyValue){const fd=new FormData(qs('#generic-form')),o={};fd.forEach((v,k)=>o[k]=v);if(keyValue)o[KEYS[sheet]]=keyValue;try{await run('adminSaveRow',TOKEN,sheet,o);closeModal();await refreshAll();}catch(e){alert(e.message)}}
async function deleteGeneric(sheet,key){if(!confirm('Delete this item?'))return;try{await run('adminDeleteRow',TOKEN,sheet,key);closeModal();await refreshAll();}catch(e){alert(e.message)}}
function renderTable(sheet,cols,addLabel){const key=KEYS[sheet],rows=table(sheet);return `<div class="toolbar"><button class="btn primary" onclick="openGeneric('${sheet}','')">+ ${addLabel}</button></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${['Show','Approved','Status','Visibility'].includes(c)?pill(r[c]):esc(r[c]??'')}</td>`).join('')}<td><button class="btn small" onclick="openGeneric('${sheet}','${esc(r[key])}')">Edit</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}">No records yet.</td></tr>`}</tbody></table></div>`}
function renderSchedule(){qs('#view').innerHTML=pageHead('Storm Tracker','Schedule & Games','Add a practice or game once. It automatically becomes available to the rest of Storm HQ.',`<button class="btn primary" onclick="openGeneric('Website Calendar','')">+ Add Event</button>`)+helpBox('Use plain times like <b>6:00 PM</b>. For games, add opponent, arrival time, uniform, and event notes. View Details and the countdown use this same record.')+renderTable('Website Calendar',['Date','Time','Type','Title','Opponent','Location','Field','Status'],'Add Event')}
function renderMessages(){qs('#view').innerHTML=pageHead("Coach's Forecast",'Team Messages','Post public announcements or family-only information without touching the website code.',`<button class="btn orange" onclick="openGeneric('Website Announcements','')">+ Post Message</button>`)+helpBox('Set Visibility to PUBLIC, FAMILY, or BOTH. Use Storm Warning for important changes and PinToHome = YES for homepage priority.')+renderTable('Website Announcements',['AlertLevel','Visibility','Title','StartDate','EndDate','Show'],'Post Message')}
function renderTryouts(){qs('#view').innerHTML=pageHead('Join the Storm','Tryout Manager','Create and change tryouts, open practices, by-appointment opportunities, and roster needs.',`<button class="btn primary" onclick="openGeneric('Website Tryouts','')">+ Add Tryout</button>`)+helpBox('When Status becomes Closed/Completed or Show = NO, it can disappear from recruiting areas. RegistrationURL can point to Player Interest or another registration form.')+renderTable('Website Tryouts',['Date','Time','Status','Title','PositionsWanted','Location','Show'],'Add Tryout')}

function renderPlayers(){const rows=table('Website Players').sort((a,b)=>(+a.SortOrder||99)-(+b.SortOrder||99));qs('#view').innerHTML=pageHead('Meet the Storm','Players & Photo Framing','Upload the original photo, then frame the player card and full profile independently.',`<button class="btn primary" onclick="openPlayer('')">+ Add Player</button>`)+helpBox('The live previews are the important part: X moves left/right, Y moves up/down, Zoom changes crop. Save only when the face is framed correctly in both previews.')+`<div class="grid three">${rows.map(p=>`<div class="card"><div style="height:220px;border-radius:14px;overflow:hidden;background:#09060e"><img src="${esc(p.PhotoURL||'')}" style="width:100%;height:100%;object-fit:cover;object-position:${p.CardX||50}% ${p.CardY||35}%;transform:scale(${p.CardZoom||1});transform-origin:${p.CardX||50}% ${p.CardY||35}%"></div><span class="kicker">#${esc(p.Jersey||'')}</span><h3>${esc(p.FirstName||'Player')}</h3><p style="color:var(--muted)">${esc(p.Positions||'')}</p><button class="btn small" onclick="openPlayer('${esc(p.PlayerID)}')">Edit Player & Photo</button></div>`).join('')}</div>`}
function openPlayer(id){const p=table('Website Players').find(x=>String(x.PlayerID)===String(id))||{Show:'YES',Approved:'YES',CardX:50,CardY:35,CardZoom:1,ProfileX:50,ProfileY:35,ProfileZoom:1,SortOrder:99};PLAYER_UPLOAD=p.PhotoURL||'';const body=`<div class="player-editor"><div class="crop-stack"><div><span class="kicker">Roster Card Preview</span><div id="card-preview" class="crop-preview" style="--x:${p.CardX||50}%;--y:${p.CardY||35}%;--z:${p.CardZoom||1}"><img id="card-img" src="${esc(p.PhotoURL||'')}"><span class="label">Player Card</span></div></div><div class="range-row"><span>X</span><input id="card-x" type="range" min="0" max="100" value="${p.CardX||50}" oninput="updateCrops()"><b id="card-x-v">${p.CardX||50}%</b></div><div class="range-row"><span>Y</span><input id="card-y" type="range" min="0" max="100" value="${p.CardY||35}" oninput="updateCrops()"><b id="card-y-v">${p.CardY||35}%</b></div><div class="range-row"><span>Zoom</span><input id="card-z" type="range" min="100" max="180" value="${Math.round((p.CardZoom||1)*100)}" oninput="updateCrops()"><b id="card-z-v">${(p.CardZoom||1).toFixed?Number(p.CardZoom||1).toFixed(2):p.CardZoom}</b></div><div><span class="kicker">Profile Preview</span><div id="profile-preview" class="crop-preview profile" style="--x:${p.ProfileX||50}%;--y:${p.ProfileY||35}%;--z:${p.ProfileZoom||1}"><img id="profile-img" src="${esc(p.BackgroundURL||p.PhotoURL||'')}"><span class="label">Profile Hero</span></div></div><div class="range-row"><span>X</span><input id="profile-x" type="range" min="0" max="100" value="${p.ProfileX||50}" oninput="updateCrops()"><b id="profile-x-v">${p.ProfileX||50}%</b></div><div class="range-row"><span>Y</span><input id="profile-y" type="range" min="0" max="100" value="${p.ProfileY||35}" oninput="updateCrops()"><b id="profile-y-v">${p.ProfileY||35}%</b></div><div class="range-row"><span>Zoom</span><input id="profile-z" type="range" min="100" max="180" value="${Math.round((p.ProfileZoom||1)*100)}" oninput="updateCrops()"><b id="profile-z-v">${Number(p.ProfileZoom||1).toFixed(2)}</b></div><div class="field"><label>Upload New Original Photo</label><input id="player-file" type="file" accept="image/*"><button type="button" class="btn orange" style="margin-top:10px" onclick="uploadPlayerPhoto()">Upload Photo</button><div id="player-upload-status" style="margin-top:8px;color:var(--muted)">Choose a photo, then click Upload Photo.</div></div></div><form id="player-form"><div class="form-grid"><div class="field"><label>Show</label><select name="Show"><option ${p.Show==='YES'?'selected':''}>YES</option><option ${p.Show==='NO'?'selected':''}>NO</option></select></div><div class="field"><label>Approved</label><select name="Approved"><option ${p.Approved==='YES'?'selected':''}>YES</option><option ${p.Approved==='NO'?'selected':''}>NO</option></select></div><div class="field"><label>Jersey</label><input name="Jersey" value="${esc(p.Jersey||'')}"></div><div class="field"><label>First Name</label><input name="FirstName" value="${esc(p.FirstName||'')}"></div><div class="field"><label>Last Initial (optional)</label><input name="LastInitial" value="${esc(p.LastInitial||'')}"></div><div class="field"><label>Positions</label><input name="Positions" value="${esc(p.Positions||'')}"></div><div class="field"><label>Bats / Throws</label><input name="BatsThrows" value="${esc(p.BatsThrows||'R/R')}"></div><div class="field"><label>Class Year</label><input name="ClassYear" value="${esc(p.ClassYear||'2035')}"></div><div class="field full"><label>Strongest Part</label><textarea name="StrongestPart">${esc(p.StrongestPart||'')}</textarea></div><div class="field full"><label>Season Goal</label><textarea name="SeasonGoal">${esc(p.SeasonGoal||'')}</textarea></div><div class="field"><label>Favorite Color</label><input name="FavoriteColor" value="${esc(p.FavoriteColor||'')}"></div><div class="field"><label>Favorite Player</label><input name="FavoritePlayer" value="${esc(p.FavoritePlayer||'')}"></div><div class="field"><label>Excitement 1-10</label><input name="Excitement" value="${esc(p.Excitement||'')}"></div><div class="field"><label>Sort Order</label><input name="SortOrder" type="number" value="${esc(p.SortOrder||99)}"></div><div class="field full"><label>Player Quote</label><input name="Quote" value="${esc(p.Quote||'')}"></div></div><div class="button-row" style="margin-top:16px"><button type="button" class="btn primary" onclick="savePlayer('${esc(p.PlayerID||'')}')">Save Player</button>${p.PlayerID?`<button type="button" class="btn bad" onclick="deletePlayer('${esc(p.PlayerID)}')">Delete</button>`:''}</div></form></div></div>`;openModal(p.PlayerID?'Edit Player':'Add Player',body,'Player Photo Studio');}
function updateCrops(){[['card','card-preview'],['profile','profile-preview']].forEach(([p,id])=>{const x=qs('#'+p+'-x').value,y=qs('#'+p+'-y').value,z=qs('#'+p+'-z').value/100,el=qs('#'+id);el.style.setProperty('--x',x+'%');el.style.setProperty('--y',y+'%');el.style.setProperty('--z',z);qs('#'+p+'-x-v').textContent=x+'%';qs('#'+p+'-y-v').textContent=y+'%';qs('#'+p+'-z-v').textContent=z.toFixed(2);});}
async function uploadPlayerPhoto(){const input=qs('#player-file'),status=qs('#player-upload-status'),f=input?.files?.[0];if(!f){status.textContent='Choose a photo first.';return;}if(f.size>8*1024*1024){status.textContent='Please use a photo under 8 MB.';return;}try{status.textContent='Reading photo...';const data=await fileData(f);status.textContent='Uploading photo to Storm HQ...';const r=await run('adminUploadImage',TOKEN,data,f.name,f.type||'image/jpeg','player');if(!r||!r.url)throw new Error('Upload finished but no photo URL was returned.');PLAYER_UPLOAD=r.url;qs('#card-img').src=r.url;qs('#profile-img').src=r.url;status.textContent='✓ Photo uploaded. Adjust the crop, then click Save Player.';}catch(e){status.textContent='Upload failed: '+e.message;}}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);})}
async function savePlayer(id){const fd=new FormData(qs('#player-form')),o={};fd.forEach((v,k)=>o[k]=v);if(id)o.PlayerID=id;o.PhotoURL=PLAYER_UPLOAD||qs('#card-img').src;o.BackgroundURL=PLAYER_UPLOAD||qs('#profile-img').src;o.CardX=qs('#card-x').value;o.CardY=qs('#card-y').value;o.CardZoom=qs('#card-z').value/100;o.ProfileX=qs('#profile-x').value;o.ProfileY=qs('#profile-y').value;o.ProfileZoom=qs('#profile-z').value/100;try{await run('adminSaveRow',TOKEN,'Website Players',o);closeModal();await refreshAll();}catch(e){alert(e.message)}}
async function deletePlayer(id){if(!confirm('Delete this player from the public player table?'))return;try{await run('adminDeleteRow',TOKEN,'Website Players',id);closeModal();await refreshAll();}catch(e){alert(e.message)}}

function renderHomework(){const weeks=table('Homework Weeks').sort((a,b)=>(+a.SortOrder||99)-(+b.SortOrder||99));if(!SELECTED_WEEK&&weeks[0])SELECTED_WEEK=weeks[0].WeekID;const w=weeks.find(x=>String(x.WeekID)===String(SELECTED_WEEK));const tasks=table('Homework Tasks').filter(t=>String(t.WeekID)===String(SELECTED_WEEK));const qsx=table('Homework Questions').filter(q=>String(q.WeekID)===String(SELECTED_WEEK));qs('#view').innerHTML=pageHead('Storm Homework','Homework Manager','Build weekly work, drills, reps, videos, and softball-IQ questions. Parents verify completion with their player code.',`<button class="btn primary" onclick="openGeneric('Homework Weeks','')">+ New Week</button>`)+helpBox('Create a Week first. Then add drills/tasks and questions to that WeekID. Set Status = ACTIVE when you want families to complete it.')+`<div class="week-builder"><div class="card"><span class="kicker">Homework Weeks</span><div class="list-stack" style="margin-top:10px">${weeks.map(x=>`<div class="list-item ${String(x.WeekID)===String(SELECTED_WEEK)?'active':''}" onclick="SELECTED_WEEK='${esc(x.WeekID)}';renderHomework()"><b>${esc(x.Title)}</b><small>${esc(x.Status)} · Due ${esc(x.DueDate||'')}</small></div>`).join('')||'<p>No weeks yet.</p>'}</div></div><div class="grid"><div class="card"><div class="page-head"><div><span class="kicker">Selected Week</span><h3>${esc(w?.Title||'Choose a week')}</h3><p>${esc(w?.Theme||'')}</p></div>${w?`<button class="btn small" onclick="openGeneric('Homework Weeks','${esc(w.WeekID)}')">Edit Week</button>`:''}</div><h3>Drills & Practice</h3><div class="button-row"><button class="btn small primary" onclick="openHomeworkChild('Homework Tasks')">+ Add Drill</button></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Category</th><th>Task</th><th>Target</th><th>Required</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.Category)}</td><td>${esc(t.Title)}</td><td>${esc(t.Target)} ${esc(t.Unit||'')}</td><td>${pill(t.Required)}</td><td><button class="btn small" onclick="openGeneric('Homework Tasks','${esc(t.TaskID)}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5">No drills yet.</td></tr>'}</tbody></table></div><h3 style="margin-top:20px">Questions & Answers</h3><div class="button-row"><button class="btn small orange" onclick="openHomeworkChild('Homework Questions')">+ Add Question</button></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Type</th><th>Question</th><th>Answer</th><th>Points</th><th></th></tr></thead><tbody>${qsx.map(q=>`<tr><td>${esc(q.Type)}</td><td>${esc(q.Question)}</td><td>${esc(q.CorrectAnswer||'Coach review')}</td><td>${esc(q.Points||1)}</td><td><button class="btn small" onclick="openGeneric('Homework Questions','${esc(q.QuestionID)}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5">No questions yet.</td></tr>'}</tbody></table></div></div></div>`}

function renderPending(){const pending=table('Pending Players').filter(p=>String(p.Status||'PENDING').toUpperCase()==='PENDING'),photos=table('Parent Photo Submissions').filter(p=>String(p.Status||'PENDING').toUpperCase()==='PENDING');qs('#view').innerHTML=pageHead('Approval Queue','Pending Approvals','Nothing from forms or family photo submissions goes public until you approve it.',`<button class="btn" onclick="importPending()">Import Existing Form Responses</button>`)+helpBox('Accepted Player submissions land here. Review, correct the public fields, then Approve. Approval creates/updates the player and generates a private parent code.')+`<div class="grid two"><div class="card"><span class="kicker">Accepted Players</span><h3>${pending.length} Waiting</h3><div class="list-stack">${pending.map(p=>`<div class="list-item"><b>${esc(p.FirstName||'Player')} ${p.Jersey?'#'+esc(p.Jersey):''}</b><small>${esc(p.Positions||'')} · ${esc(p.ParentName||'')}</small><div class="button-row" style="margin-top:8px"><button class="btn small good" onclick="approvePending('${esc(p.SubmissionID)}')">Review & Approve</button><button class="btn small bad" onclick="rejectPending('${esc(p.SubmissionID)}')">Reject</button></div></div>`).join('')||'<p>No pending players.</p>'}</div></div><div class="card"><span class="kicker">Family Photos</span><h3>${photos.length} Waiting</h3><div class="list-stack">${photos.map(p=>`<div class="list-item"><b>${esc(p.Title||'Family Photo')}</b><small>${esc(p.PlayerName||'')} · ${esc(p.ParentName||'')}</small><a class="btn small" target="_blank" href="${esc(p.ImageURL||'#')}">View</a></div>`).join('')||'<p>No pending photos.</p>'}</div></div></div>`}
function approvePending(id){const p=table('Pending Players').find(x=>String(x.SubmissionID)===String(id));if(!p)return;const body=`<form id="pending-form"><div class="form-grid"><div class="field"><label>First Name</label><input name="FirstName" value="${esc(p.FirstName||'')}"></div><div class="field"><label>Jersey</label><input name="Jersey" value="${esc(p.Jersey||'')}"></div><div class="field"><label>Positions</label><input name="Positions" value="${esc(p.Positions||'')}"></div><div class="field"><label>Bats / Throws</label><input name="BatsThrows" value="${esc(p.BatsThrows||'')}"></div><div class="field"><label>Class Year</label><input name="ClassYear" value="${esc(p.ClassYear||'')}"></div><div class="field full"><label>Strongest Part</label><textarea name="StrongestPart">${esc(p.StrongestPart||'')}</textarea></div><div class="field full"><label>Season Goal</label><textarea name="SeasonGoal">${esc(p.SeasonGoal||'')}</textarea></div><div class="field full"><label>Quote</label><input name="Quote" value="${esc(p.Quote||'')}"></div></div><button type="button" class="btn good" style="margin-top:14px" onclick="confirmApprove('${esc(id)}')">Approve to Website</button></form>`;openModal('Approve Player',body,'Pending Player Review')}

async function renderReports(){
  qs('#view').innerHTML=pageHead('Oversight','Team Reports','Weekly homework, season development totals, and event availability - all in one coach-only view.')+`<div id="report-content" class="card">Loading reports…</div>`;
  try{
    const h=await run('adminHomeworkReport',TOKEN,''),a=await run('adminAvailabilityReport',TOKEN,'');
    const weeks=(h.weeks||[]).slice().sort((x,y)=>String(x.SortOrder||x.StartDate||'').localeCompare(String(y.SortOrder||y.StartDate||'')));
    const players=h.players||[],responses=h.responses||[];
    const trackedWeeks=weeks.filter(w=>['ACTIVE','CLOSED'].includes(String(w.Status||'').toUpperCase()));
    const active=weeks.find(w=>String(w.Status).toUpperCase()==='ACTIVE')||trackedWeeks.at(-1)||weeks[0];
    const activeResponses=active?responses.filter(r=>String(r.WeekID)===String(active.WeekID)):[];
    const activeSubmitted=new Set(activeResponses.map(r=>String(r.PlayerID))).size;
    const activePct=players.length?Math.round(100*activeSubmitted/players.length):0;
    const statuses={};(a.responses||[]).forEach(r=>statuses[r.Status]=(statuses[r.Status]||0)+1);

    const parseJson=(v)=>{try{return v?JSON.parse(v):{};}catch(_){return {};}};
    const weekRows=trackedWeeks.map(w=>{
      const wr=responses.filter(r=>String(r.WeekID)===String(w.WeekID));
      const submitted=new Set(wr.map(r=>String(r.PlayerID))).size;
      const pct=players.length?Math.round(100*submitted/players.length):0;
      return `<tr><td>${esc(w.Title||w.WeekID)}</td><td>${pill(w.Status)}</td><td>${submitted}/${players.length}</td><td><div class="meter"><span style="width:${pct}%"></span></div><small>${pct}%</small></td></tr>`;
    }).join('');

    const playerRows=players.map(p=>{
      const pr=responses.filter(r=>String(r.PlayerID)===String(p.PlayerID) && trackedWeeks.some(w=>String(w.WeekID)===String(r.WeekID)));
      const weeksDone=new Set(pr.map(r=>String(r.WeekID))).size;
      let drills=0,answered=0,score=0,max=0;
      pr.forEach(r=>{
        const tasks=parseJson(r.TaskCompletionJSON),answers=parseJson(r.AnswersJSON);
        drills+=Object.values(tasks).filter(v=>{
          if(v===true)return true;
          if(typeof v==='number')return v>0;
          if(typeof v==='string')return v.trim()!=='' && v!=='0' && v.toLowerCase()!=='false';
          if(v && typeof v==='object')return !!(v.done||Number(v.value||v.reps||v.minutes||0)>0);
          return false;
        }).length;
        answered+=Object.values(answers).filter(v=>String(v??'').trim()!=='').length;
        score+=Number(r.Score||0);max+=Number(r.MaxScore||0);
      });
      const qPct=max?Math.round(score/max*100):0;
      return `<tr><td>#${esc(p.Jersey||'')} ${esc(p.FirstName||'Player')}</td><td>${weeksDone}/${trackedWeeks.length}</td><td>${drills}</td><td>${answered}</td><td>${score}/${max||0}${max?` <small>(${qPct}%)</small>`:''}</td></tr>`;
    }).join('');

    const activeList=players.map(p=>{
      const r=activeResponses.find(x=>String(x.PlayerID)===String(p.PlayerID));
      return `<div class="report-row"><span>#${esc(p.Jersey||'')} ${esc(p.FirstName||'Player')}</span>${r?`<span>${pill('Submitted')} ${esc(r.Score||0)}/${esc(r.MaxScore||0)}</span>`:pill('Not Submitted')}</div>`;
    }).join('');

    qs('#report-content').innerHTML=`
      <div class="grid four">
        <div class="stat"><span>${esc(active?.Title||'Active Homework')}</span><strong>${activeSubmitted}/${players.length}</strong><div class="meter"><span style="width:${activePct}%"></span></div></div>
        <div class="stat"><span>Ready for the Storm</span><strong>${statuses['READY FOR THE STORM']||0}</strong></div>
        <div class="stat"><span>Not Available</span><strong>${statuses['NOT AVAILABLE']||0}</strong></div>
        <div class="stat"><span>Availability Updates</span><strong>${(a.responses||[]).length}</strong></div>
      </div>
      <div class="grid two" style="margin-top:16px">
        <div class="card inset"><span class="kicker">This Week</span><h3>${esc(active?.Title||'Homework')}</h3>${activeList||'<p>No players yet.</p>'}</div>
        <div class="card inset"><span class="kicker">Weekly Running Total</span><h3>Team Completion</h3><div class="table-wrap"><table><thead><tr><th>Week</th><th>Status</th><th>Submitted</th><th>Completion</th></tr></thead><tbody>${weekRows||'<tr><td colspan="4">No active/closed homework weeks yet.</td></tr>'}</tbody></table></div></div>
      </div>
      <div class="card inset" style="margin-top:16px"><span class="kicker">Season Development</span><h3>Player Running Totals</h3><p style="color:var(--muted)">Coach-only totals. Individual completion is never posted publicly.</p><div class="table-wrap"><table><thead><tr><th>Player</th><th>Weeks Submitted</th><th>Drills Completed</th><th>Questions Answered</th><th>Question Score</th></tr></thead><tbody>${playerRows||'<tr><td colspan="5">No roster data yet.</td></tr>'}</tbody></table></div></div>`;
  }catch(e){qs('#report-content').textContent=e.message}
}

function renderSettings(){const s=BOOT.settings||{},forms=table('Form Registry');const keys=[['teamName','Team Name'],['teamShort','Short Team Name'],['tagline','Tagline'],['ageGroup','Age Group'],['homeField','Home Field'],['coach','Coach Name'],['phone','Public Phone'],['email','Public Email'],['heroCopy','Homepage Hero Copy'],['brandPrimary','Primary Color'],['brandSecondary','Secondary Color'],['brandAccent','Accent Color'],['brandDark','Dark Background'],['logoURL','Logo URL'],['interest','Player Interest Form'],['profile','Accepted Player Form'],['message','Private Message Form'],['photo','Picture Form'],['gamechanger','GameChanger'],['facebook','Facebook'],['instagram','Instagram'],['websiteDomain','Website Domain']];qs('#view').innerHTML=pageHead('System & Brand','Branding, Forms & Links','This is what makes the system reusable and eventually sellable: team identity and links live in settings, not hard-coded throughout the site.',`<button class="btn primary" onclick="saveSettings()">Save Settings</button>`)+helpBox('You can rebrand the entire site here. Upload a logo below, change colors, then Save Settings. Use Create / Repair Google Forms during first setup.')+`<div class="grid two"><div class="card"><span class="kicker">Brand Controls</span><h3>Team Identity</h3><form id="settings-form"><div class="form-grid">${keys.map(([k,l])=>`<div class="field ${k==='heroCopy'?'full':''}"><label>${l}</label>${k==='heroCopy'?`<textarea name="${k}">${esc(s[k]||'')}</textarea>`:`<input name="${k}" value="${esc(s[k]||'')}">`}</div>`).join('')}</div></form><div class="field" style="margin-top:12px"><label>Upload New Logo</label><input type="file" accept="image/*" onchange="uploadLogo(this)"></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Save Brand & Links</button></div><div class="card"><span class="kicker">Google Forms</span><h3>Form Registry</h3><div class="button-row"><button class="btn orange" onclick="createForms()">Create / Repair Forms</button><button class="btn" onclick="generateCodes()">Generate Parent Codes</button><button class="btn" onclick="health()">System Health</button></div><div class="list-stack" style="margin-top:14px">${forms.map(f=>`<div class="list-item"><b>${esc(f.FormTitle||f.FormKey)}</b><small>${esc(f.ResponseSheet||'Response tab not detected')} · ${esc(f.Active||'')}</small>${f.PublicURL?`<a class="btn small" target="_blank" href="${esc(f.PublicURL)}">Open Form</a>`:''}</div>`).join('')||'<p>No forms registered yet.</p>'}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><span class="kicker">Connection</span><h3>Apps Script Web App URL</h3><p style="word-break:break-all;color:var(--muted)">${esc(APP_URL||'Deploy the web app first.')}</p></div></div>`}

Head('Help Center','How to Run Storm HQ','Every major task is designed to be done from this control center. The full owner’s manual is included with the master package.')+`<div class="grid two">${topics.map(([h,p])=>`<article class="card"><span class="kicker">How To</span><h3>${h}</h3><p style="color:var(--muted)">${p}</p></article>`).join('')}</div>`}
